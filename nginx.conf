server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 512;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;

    error_page 404 /404.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /index.html {
        expires -1;
    }

    location = /404.html {
        internal;
        expires -1;
    }

    location = /es {
        return 301 /es/;
    }

    location /es/ {
        expires -1;
        try_files $uri $uri/ =404;
        error_page 404 /es/404.html;
    }

    location = /es/404.html {
        internal;
        expires -1;
    }

    location = /robots.txt {
        expires 1d;
    }

    location = /favicon.ico {
        access_log off;
        try_files $uri =404;
    }

    location = /og-image.png {
        access_log off;
        expires 30d;
    }

    location = /og-image-es.png {
        access_log off;
        expires 30d;
    }

    location /assets/fonts/ {
        access_log off;
        expires 1y;
        try_files $uri =404;
    }

    location /assets/img/ {
        access_log off;
        expires 30d;
        try_files $uri =404;
    }

    location /assets/css/ {
        expires 7d;
        try_files $uri =404;
    }

    location /assets/js/ {
        expires 7d;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
